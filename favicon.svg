      <rect x="-6.5" y="-38" width="13" height="26" fill="white" transform="rotate(-62)"/>
      <rect x="-6.5" y="-38" width="13" height="26" fill="white" transform="rotate(-17)"/>
      <rect x="-6.5" y="-38" width="13" height="26" fill="white" transform="rotate(28)"/>
      <rect x="-6.5" y="-38" width="13" height="26" fill="white" transform="rotate(73)"/>
      <rect x="-6.5" y="-38" width="13" height="26" fill="white" transform="rotate(118)"/>
